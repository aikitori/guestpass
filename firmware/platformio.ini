; Firmware for the CrowPanel ESP32 4.2" E-Paper (PCB V1.2A, green sticker on the back).
; Shows the guest Wi-Fi QR code, SSID and password that send_to_display.py posts.

[env:crowpanel42]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; USB goes through a CH340 UART, which fails at 921600 baud
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    adafruit/Adafruit GFX Library@^1.12.1
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    ricmoo/QRCode@^0.0.1
    bblanchon/ArduinoJson@^7.4.2
